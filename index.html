<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hash Thematic Project</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</head>
<body>

<div class="hash-box" id="HashSummary">

    <label for="hashInput">Hash Input</label>

    <textarea 
        id="hashInput"
        placeholder="Enter hash here...">
    </textarea>
    <button onclick="main()">Check Hash</button>

    <div class="hash-info" id="hash-info">
        <span id="inputtedhash">Inputted Hash:</span>
        <br>
        <br>
        <span id="charCount">Characters: 0</span>
        <br>
        <span id="hashType">Possible Hashes: Unknown</span>
        <br>

         <div id="hashDescription" class="hash-description">
        Enter a hash to see its description.
        </div>
    </div>

   

    <button onclick="exportPDF()">Export to PDF</button>
    <button onclick="exportCSV()">Export to CSV</button>
    <button onclick="exportJSON()">Export to JSON</button>

</div>

<script src="main.js"></script>
</body>
</html>
